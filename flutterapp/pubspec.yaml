name: coventry_university_app
description: Coventry University mobile application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.17.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.4.0
  shared_preferences: ^2.5.3
  webview_flutter: ^4.7.0
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  path: ^1.8.3
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/data/
